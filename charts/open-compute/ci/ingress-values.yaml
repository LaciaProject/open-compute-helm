auth:
  existingSecret: open-compute-auth
config:
  publicOrigin: https://compute.example.com
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "64m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
  tls:
    - secretName: compute-tls
      hosts:
        - compute.example.com
