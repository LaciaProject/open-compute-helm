apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-compute.fullname" . }}
  labels:
    {{- include "open-compute.labels" . | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      {{- if and .Values.service.nodePort (has .Values.service.type (list "NodePort" "LoadBalancer")) }}
      nodePort: {{ .Values.service.nodePort }}
      {{- end }}
  selector:
    {{- include "open-compute.selectorLabels" . | nindent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "open-compute.fullname" . }}-headless
  labels:
    {{- include "open-compute.labels" . | nindent 4 }}
spec:
  clusterIP: None
  ports:
    - name: http
      port: 8787
      targetPort: http
  selector:
    {{- include "open-compute.selectorLabels" . | nindent 4 }}
