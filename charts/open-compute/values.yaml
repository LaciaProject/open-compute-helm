# One daemon owns the SQLite databases. Multiple replicas are unsupported.
replicaCount: 1

image:
  repository: ghcr.io/elliothux/open-compute
  tag: "" # Defaults to Chart.appVersion.
  digest: ""
  pullPolicy: IfNotPresent
initImage:
  repository: ghcr.io/elliothux/open-compute-init
  tag: "" # Keep this version aligned with image.tag.
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# Create this Secret before installing the chart. Tokens must be nonempty and distinct.
# Upstream copies tokens into private files during FIRST initialization only.
auth:
  existingSecret: ""
  adminKey: admin-token
  deployerKey: deployer-token
  readOnlyKey: read-only-token

config:
  # Used for Artifacts URLs and live-tail URLs. Set to the reachable API origin.
  # Does not configure Worker public domains or the upstream managed Gateway.
  publicOrigin: http://127.0.0.1:8787

persistence:
  enabled: true
  existingClaim: ""
  # null uses the cluster default StorageClass; "" explicitly disables dynamic provisioning.
  storageClass: null
  accessModes:
    - ReadWriteOnce
  size: 20Gi
  # Avoids lost+found at a freshly formatted volume root.
  subPath: open-compute
  annotations: {}

# Object storage is selected at FIRST initialization. SQLite and keys always need a PVC.
storage:
  backend: local
  s3:
    endpoint: ""
    region: us-east-1
    bucket: ""
    prefix: open-compute/system/
    r2Prefix: open-compute/tenant/r2/
    existingSecret: ""
    accessKeyIdKey: access-key-id
    secretAccessKeyKey: secret-access-key

service:
  type: ClusterIP
  port: 8787
  nodePort: null
  annotations: {}

# Exposes the API/Dashboard listener, which also has local Worker host routing.
# A custom public Worker domain needs separate upstream Gateway configuration.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: compute.example.com
      paths:
        - path: /
          pathType: Prefix
  tls: []

podAnnotations: {}
podLabels: {}
podSecurityContext:
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

# The upstream init image starts as root to chown the data directory, then drops
# to UID 65532 before starting ocd. Root-squashed volumes are unsupported.
initSecurityContext:
  runAsNonRoot: false
  runAsUser: 0
  runAsGroup: 0
  readOnlyRootFilesystem: true
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
    add: [CHOWN, FOWNER, DAC_OVERRIDE, SETUID, SETGID]

resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi
initResources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 2Gi

terminationGracePeriodSeconds: 60
startupProbe:
  periodSeconds: 5
  timeoutSeconds: 3
  failureThreshold: 60
livenessProbe:
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 6
readinessProbe:
  periodSeconds: 10
  timeoutSeconds: 5
  failureThreshold: 3

nodeSelector:
  kubernetes.io/os: linux
tolerations: []
affinity: {}

# Additional non-auth environment variables, e.g. RUST_LOG; never put token values here.
extraEnv: []
extraEnvFrom: []
