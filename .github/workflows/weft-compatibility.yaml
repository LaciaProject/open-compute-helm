name: Weft compatibility

on:
  push:
    branches: [ci]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weft-compatibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Actual Weft against open-compute
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Read pinned verification inputs
        id: inputs
        run: |
          node --input-type=module <<'JS' >> "$GITHUB_OUTPUT"
          import {readFileSync} from 'node:fs';
          const lock=JSON.parse(readFileSync('.github/weft-compatibility.lock.json'));
          console.log(`weft_repository=${lock.weft.repository}`);
          console.log(`weft_ref=${lock.weft.ref}`);
          console.log(`oc_repository=${lock.openComputeSource.repository}`);
          console.log(`oc_ref=${lock.openComputeSource.ref}`);
          JS
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.inputs.outputs.weft_repository }}
          ref: ${{ steps.inputs.outputs.weft_ref }}
          path: .test-sources/weft
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.inputs.outputs.oc_repository }}
          ref: ${{ steps.inputs.outputs.oc_ref }}
          path: .test-sources/open-compute
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .test-sources/weft/package-lock.json
      - name: Install pinned Weft dependencies
        working-directory: .test-sources/weft
        run: npm ci
      - name: Build the unmodified Weft checkout
        working-directory: .test-sources/weft
        run: npm run build
      - name: Build the actual workspace image
        id: workspace
        working-directory: .test-sources/weft
        run: |
          node scripts/workspace-container.mjs --local
          echo "image=$(node scripts/workspace-container.mjs --tag)" >> "$GITHUB_OUTPUT"
      - uses: azure/setup-helm@v4.3.0
        with:
          version: v3.17.3
      - uses: helm/kind-action@v1.12.0
        with:
          version: v0.27.0
          kubectl_version: v1.32.2
          cluster_name: weft-compatibility
          node_image: kindest/node:v1.32.2
      - name: Verify real runtime and report compatibility blockers
        env:
          WEFT_CONTAINER_IMAGE: ${{ steps.workspace.outputs.image }}
        run: bash .github/scripts/weft-kind.sh
      - name: Retain compatibility report and runtime diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: weft-compatibility
          path: .test-output/weft/
          include-hidden-files: true
          if-no-files-found: warn
